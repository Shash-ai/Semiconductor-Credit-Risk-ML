        .alert-toast {

        #loader {
            position: fixed;

        #processing-loader {
            position: fixed;
            top: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #ddd;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }


        /* Full screen overlay */
        .loader-overlay {
            position: fixed;
            inset: 0; /* shorthand for top:0; left:0; right:0; bottom:0; */
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            gap: 15px;
        }

        /* Loader GIF styling */
        .loader-gif {
            /* width: 100px; /* adjust size */ */ height: auto;
        }

        /* Text below loader */

            font-size: 18px;

            letter-spacing: 1px;

    <script>
        function updateDateTime() {
            const now = new Date();

            // Format date as "23 October, 2024"
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            const formattedDate = now.toLocaleDateString('en-GB', options);

            // Format time as "04 : 12 : 09 PM"
            const formattedTime = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            }).replace(/:/g, ' : ');

            // Update the divs
            document.getElementById('date').textContent = formattedDate + ' |';
            document.getElementById('time').innerHTML = '&nbsp;' + formattedTime;
        }

        // Update every second
        setInterval(updateDateTime, 1000);

        // Initialize on load
        updateDateTime();
    </script>
